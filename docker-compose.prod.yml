version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-openskill}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      POSTGRES_DB: ${DB_NAME:-openskill}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-openskill}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # R92[H2]: cp:apireq:* hour-buckets are the ONLY record of billable API
    # usage between hourly flushes, and the daily quota MGETs them —
    # allkeys-lru could evict them (silent revenue loss + quota reset) and
    # no persistence lost them on restart. noeviction + AOF: writes fail
    # loudly at maxmemory (metering middleware fails open by design) and
    # counters survive restarts.
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    build:
      context: apps/api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-openskill}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-openskill}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-openskill}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      CORS_ORIGINS: '["${FRONTEND_URL:-http://localhost:3000}"]'
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "${API_PORT:-8000}:8000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
      API_URL: http://api:8000
    ports:
      - "${WEB_PORT:-3000}:3000"

  # R92[H3]: the outbox worker (rating, invoicing, revshare, all crons) is a
  # REQUIRED service — without it usage is never rated, periods never close,
  # api counters TTL-expire unbilled, and trials never expire.
  worker:
    build:
      context: apps/api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-openskill}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-openskill}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-openskill}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    command: ["uv", "run", "arq", "app.controlplane.worker.WorkerSettings"]

  # Run migrations on deploy
  migrate:
    build:
      context: apps/api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-openskill}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-openskill}
    command: ["uv", "run", "alembic", "upgrade", "head"]
    restart: "no"

volumes:
  pgdata:
  miniodata:
  redisdata:
