services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-openskill}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      POSTGRES_DB: ${DB_NAME:-openskill}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-openskill}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # R92[H2]: cp:apireq:* hour-buckets are the ONLY record of billable API
    # usage between hourly flushes, and the daily quota MGETs them —
    # allkeys-lru could evict them (silent revenue loss + quota reset) and
    # no persistence lost them on restart. noeviction + AOF: writes fail
    # loudly at maxmemory (metering middleware fails open by design) and
    # counters survive restarts.
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY required}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    build:
      context: apps/api
    restart: unless-stopped
    # R554: lifespan shutdown drains in-flight workflow tasks for up to 15s
    # (plus uvicorn finishing in-flight requests) — docker's default 10s
    # grace SIGKILLed it mid-drain, cancelling provider calls and leaving
    # RUNNING steps for the sweeper.
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      # R552: on a FIRST deploy api/worker raced the migration job — the API
      # would start serving (and the worker ticking crons) against a database
      # with no tables. Gate both on the one-shot migrate exiting 0.
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: production
      # R551: the mock verifier always verifies (domain-ownership bypass);
      # production boot refuses anything but dns.
      DOMAIN_VERIFIER: dns
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-openskill}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-openskill}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY required}
      S3_BUCKET: ${S3_BUCKET:-openskill}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      # R549: webhook/connection secrets-at-rest key — config refuses to
      # boot production without it, but the compose never passed it through.
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY required}
      CORS_ORIGINS: '["${FRONTEND_URL:-http://localhost:3000}"]'
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "${API_PORT:-8000}:8000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # R533: build-time proxy target for the /api/* rewrite (same-origin
      # topology; see docs/ops/integration-fabric-operations.md §8a). The old
      # runtime NEXT_PUBLIC_API_URL was doubly wrong: NEXT_PUBLIC_* is inert
      # at runtime, and http://api:8000 is neither browser-reachable nor
      # allowed by the connect-src 'self' CSP.
      args:
        API_PROXY_URL: http://api:8000
    restart: unless-stopped
    depends_on:
      # R552: the bare form only orders container CREATION — web came up (and
      # its own healthcheck went green: / renders without the API) while every
      # proxied /api/* call 502'd. Wait for the api image HEALTHCHECK
      # (GET /api/v1/health) instead.
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"

  # R92[H3]: the outbox worker (rating, invoicing, revshare, all crons) is a
  # REQUIRED service — without it usage is never rated, periods never close,
  # api counters TTL-expire unbilled, and trials never expire.
  worker:
    build:
      context: apps/api
    restart: unless-stopped
    # R554: on_shutdown drains fire-and-forget advance_run tasks for up to
    # 30s (R89[M15]) — the default 10s grace defeated exactly that fix.
    stop_grace_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # R552: same first-deploy race as api — crons against missing tables.
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: production
      # R551: the mock verifier always verifies (domain-ownership bypass);
      # production boot refuses anything but dns.
      DOMAIN_VERIFIER: dns
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-openskill}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-openskill}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY required}
      S3_BUCKET: ${S3_BUCKET:-openskill}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      # R549: webhook/connection secrets-at-rest key — config refuses to
      # boot production without it, but the compose never passed it through.
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY required}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    command: ["uv", "run", "arq", "app.controlplane.worker.WorkerSettings"]
    # R547: the api image's HEALTHCHECK curls :8000/health — a worker serves
    # no HTTP, so it reported permanently UNHEALTHY (operational false
    # alarm; anything gated on its health never starts). A live arq worker
    # maintains its redis health key; check THAT.
    healthcheck:
      test:
        [
          "CMD",
          "uv",
          "run",
          "python",
          "-c",
          "import asyncio, sys; from redis.asyncio import from_url; from app.config import settings; sys.exit(0 if asyncio.run(from_url(settings.redis_url).exists('arq:queue:health-check')) else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Run migrations on deploy
  migrate:
    build:
      context: apps/api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-openskill}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-openskill}
      # R550: alembic env.py imports app settings, whose PRODUCTION boot
      # validators raise on default JWT/S3 and a missing encryption key —
      # with only DATABASE_URL the shipped migrate service crashed before
      # running a single migration.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY required}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY required}
      DOMAIN_VERIFIER: dns
    command: ["uv", "run", "alembic", "upgrade", "head"]
    restart: "no"
    # R547: one-shot job — the inherited HTTP healthcheck is meaningless.
    healthcheck:
      disable: true

volumes:
  pgdata:
  miniodata:
  redisdata:
