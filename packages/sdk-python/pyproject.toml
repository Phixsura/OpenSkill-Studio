[project]
name = "openskill-sdk"
version = "0.1.0"
description = "OpenSkill Platform SDK for Python — build apps, connectors, and extensions"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
