name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # R557: supply-chain + secrets gates — all three were local-only rituals
  # (R539/R540); nothing stopped a leaked key or a new advisory at the PR.
  security:
    name: Security (gitleaks + dependency audits)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # gitleaks scans history
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit gate (dispositions in scripts/audit-gate.mjs)
        run: node scripts/audit-gate.mjs
      - uses: astral-sh/setup-uv@v5
      - run: cd apps/api && uv sync --extra dev
      - name: pip-audit
        run: cd apps/api && uv run --with pip-audit pip-audit

  lint-frontend:
    name: Lint (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web lint
      - run: pnpm type-check

  lint-backend:
    name: Lint (Backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: cd apps/api && uv sync --extra dev
      - run: cd apps/api && uv run ruff check .
      - run: cd apps/api && uv run ruff format --check .

  test-frontend:
    name: Test (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web test

  test-backend:
    name: Test (Backend)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: openskill_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # MinIO for the real-storage media suite. GH service containers cannot
      # pass a command to minio/minio, and bitnami's public :latest tag was
      # withdrawn — run the official image directly instead.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 2
          done
      # test_multimodal_eval probes the real ffmpeg/ffprobe binaries
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: cd apps/api && uv sync --extra dev
      # the DB suites run against a REAL migrated schema — same as local dev
      # pre-create the S3 bucket: test_full_integration sorts BEFORE
      # test_media_db and touches storage before anything else creates it
      - name: Ensure MinIO bucket
        run: |
          cd apps/api && uv run python - <<'PY'
          import asyncio
          from app.core.storage import get_s3_client, ensure_bucket
          async def main():
              async for client in get_s3_client():
                  await ensure_bucket(client)
          asyncio.run(main())
          PY
        env:
          APP_ENV: test
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
      - run: cd apps/api && uv run alembic upgrade head
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/openskill_test
      - run: >
          cd apps/api && APP_ENV=test PYTHONPATH=.
          uv run pytest -q --timeout=120 --cov=app --cov-fail-under=75
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/openskill_test
          REDIS_URL: redis://localhost:6379/0
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin

  test-talent:
    name: Test (Talent Layer — fast)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: cd apps/api && uv sync --extra dev
      - name: Run talent unit tests (no DB required)
        run: >
          cd apps/api && PYTHONPATH=.
          uv run pytest tests/talent/ -q --timeout=60

  e2e-integration-fabric:
    name: E2E (Integration Fabric live-HTTP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test-backend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: openskill_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 2
          done
      - run: cd apps/api && uv sync --extra dev
      - name: Ensure MinIO bucket
        run: |
          cd apps/api && uv run python - <<'PY'
          import asyncio
          from app.core.storage import get_s3_client, ensure_bucket
          async def main():
              async for client in get_s3_client():
                  await ensure_bucket(client)
          asyncio.run(main())
          PY
        env:
          APP_ENV: test
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
      - run: cd apps/api && uv run alembic upgrade head
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/openskill_test
      - name: Run fabric live-HTTP lifecycle (62 checks)
        run: make e2e-intg
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/openskill_test
          REDIS_URL: redis://localhost:6379/0
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
      - name: Run fabric hostile-input fuzz (zero 5xx invariant)
        run: make e2e-intg-fuzz
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/openskill_test
          REDIS_URL: redis://localhost:6379/0
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
      - name: Run app-wide OpenAPI hostile sweep (zero unexplained 5xx)
        run: make e2e-intg-appwide
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/openskill_test
          REDIS_URL: redis://localhost:6379/0
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
      - name: Run scim2-tester conformance (zero hard failures)
        run: make e2e-intg-scim-conformance
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/openskill_test
          REDIS_URL: redis://localhost:6379/0
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin

  test-playwright:
    name: Test (Playwright E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [test-frontend, test-backend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: openskill_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: astral-sh/setup-uv@v5
      - run: pnpm install --frozen-lockfile
      - run: cd apps/api && uv sync --extra dev
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 2
          done
      - name: Ensure MinIO bucket
        run: |
          cd apps/api && uv run python - <<'PY'
          import asyncio
          from app.core.storage import get_s3_client, ensure_bucket
          async def main():
              async for client in get_s3_client():
                  await ensure_bucket(client)
          asyncio.run(main())
          PY
        env:
          APP_ENV: test
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
      - run: cd apps/api && uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/openskill_test
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Start API server
        run: |
          cd apps/api && APP_ENV=test DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/openskill_test REDIS_URL=redis://localhost:6379/0 S3_ENDPOINT=http://localhost:9000 S3_ACCESS_KEY=minioadmin S3_SECRET_KEY=minioadmin uv run uvicorn app.main:app --no-server-header --host 0.0.0.0 --port 8000 &
          sleep 5
      - name: Start frontend
        run: |
          pnpm --filter web dev &
          sleep 15
      - name: Run Playwright (talent + sweep + integrations)
        run: >
          cd apps/web && npx playwright test
          e2e/talent-pages.spec.ts e2e/sweep-all-pages.spec.ts
          e2e/sweep-integrations.spec.ts
          e2e/sweep-a11y-integrations.spec.ts
          --reporter=line
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_API_URL: http://localhost:8000/api/v1

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-frontend, lint-backend, test-frontend, test-backend, test-talent]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
