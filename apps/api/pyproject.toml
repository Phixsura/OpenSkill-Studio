[project]
name = "openskill-api"
version = "0.1.0"
description = "OpenSkill Studio API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.14",
    "pydantic-settings>=2.7,<3",
    "redis>=5.0,<7",
    "aioboto3>=13.0",
    "structlog>=24.0",
    "python-ulid>=3.0",
    "pyjwt>=2.9,<3",
    "bcrypt>=4.2,<6",
    "pydantic[email]>=2.0,<3",
    "python-multipart>=0.0.18",
    "arq>=0.26",
    "anthropic>=0.40",
    "openai>=1.50",
    "httpx>=0.28",
    "cryptography>=43.0",
    "stripe>=11,<13",
    "dnspython>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
ignore = ["E501", "B008", "UP046", "UP042", "SIM117"]

[tool.ruff.lint.per-file-ignores]
"migrations/env.py" = ["E402"]
"migrations/versions/*" = ["E501", "W291"]
# R202: standalone dev tool (CLI mutation harness), not a test module —
# compact multi-statement AST-dispatch style is intentional.
"tests/tools_ast_mutate.py" = ["E701", "E702", "RUF001", "RUF003"]
# Section-scoped imports in large test files for readability
"tests/talent/test_z_services_comprehensive.py" = ["E402"]
"tests/talent/test_z_api_endpoints_comprehensive.py" = ["E402"]
# Import-after-docstring in API modules
"app/talent/api/bookmarks.py" = ["E402"]
"app/talent/api/saved_searches.py" = ["E402"]
"app/talent/api/intelligence.py" = ["E402"]
"app/talent/api/messages.py" = ["E402"]
"app/talent/api/offers.py" = ["E402"]
"app/talent/api/onboarding_api.py" = ["E402"]
"app/talent/api/outreach.py" = ["E402"]
"app/talent/api/passport.py" = ["E402"]
"app/talent/api/portfolio.py" = ["E402"]
"app/talent/api/scheduling.py" = ["E402"]
"app/talent/api/succession.py" = ["E402"]
"app/talent/api/webhooks.py" = ["E402"]
# Services with structlog added after docstring
"app/talent/services/endorsements.py" = ["E402"]
"app/talent/services/career_goals.py" = ["E402"]
"app/talent/services/credential_pathways.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "mutmut>=3.7.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
]

# ── mutmut (R198 overnight systematic mutation run — money core) ──
[tool.mutmut]
source_paths = ["app"]
# Smoke scope first; widened to the full money core before the night run.
# R198 v3 (owner: faster path): full-backend mutation was a 12-30h job
# (49,943 mutants). Replaced by branch-coverage gap analysis (finds every
# untested line in one run) + TRUE mutation on the money core only (catches
# weak assertions on top of coverage).
only_mutate = [
    "app/controlplane/services/billing.py",
    "app/controlplane/services/credits.py",
    "app/controlplane/services/rating.py",
    "app/controlplane/services/revenue_share.py",
    "app/controlplane/services/pricing.py",
    "app/controlplane/services/metering.py",
    "app/controlplane/services/entitlements.py",
    "app/controlplane/services/budgets.py",
    "app/controlplane/services/marketplace.py",
]
# Logging lines produce overwhelmingly equivalent-mutant noise.
do_not_mutate_patterns = ["log.", "logger."]
pytest_add_cli_args_test_selection = [
    "tests/test_cp_billing_db.py",
    "tests/test_cp_credits_db.py",
    "tests/test_cp_rating_db.py",
    "tests/test_cp_revshare_db.py",
    "tests/test_cp_metering_db.py",
    "tests/test_cp_entitlements_db.py",
    "tests/test_cp_marketplace_db.py",
    "tests/test_cp_outbox_db.py",
    "tests/test_cp_tenants_db.py",
    "tests/test_cp_adversarial.py",
    "tests/test_cp_pure_logic.py",
    "tests/test_cp_property_invariants.py",
    "tests/test_billing_time_properties.py",
    "tests/test_issue18_race_fixes.py",
    "tests/test_cp_migration_backfill.py",
]
also_copy = [".env", "alembic.ini", "migrations"]
