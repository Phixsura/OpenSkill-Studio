[project]
name = "openskill-api"
version = "0.1.0"
description = "OpenSkill Studio API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.7",
    "redis>=5.0",
    "aioboto3>=13.0",
    "structlog>=24.0",
    "python-ulid>=3.0",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "pydantic[email]>=2.0",
    "python-multipart>=0.0.18",
    "arq>=0.26",
    "anthropic>=0.40",
    "openai>=1.50",
    "httpx>=0.28",
    "cryptography>=43.0",
    "stripe>=11",
    "dnspython>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
ignore = ["E501", "B008", "UP046", "UP042", "SIM117"]

[tool.ruff.lint.per-file-ignores]
"migrations/env.py" = ["E402"]
"migrations/versions/*" = ["E501", "W291"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
]
